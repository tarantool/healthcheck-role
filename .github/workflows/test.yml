name: Testing

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        tarantool: ['3.3', '3.4', '3.5']
        include:
          - tarantool: '3.5'
            s3-upload: true
    runs-on: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@master
      - uses: tarantool/setup-tarantool@v4
        with:
          tarantool-version: ${{ matrix.tarantool }}

      - name: Setup tt
        run: |
          curl -L https://tarantool.io/release/2/installer.sh | sudo bash
          sudo apt install -y tt
          tt version

      - run: make deps

      - name: Build module
        run: |
          make build
          # Integration tests will use files from root, not from .rocks.
          tt rocks remove healthcheck-role

      - name: Run tests with code coverage analysis
        run: make test

      - name: Send code coverage to 'coveralls.io'
        run: make coveralls
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}

      - name: Upload coverage report to S3
        if: matrix.s3-upload && (github.ref_type == 'tag' || github.ref_name == 'master')
        uses: tarantool/actions/s3-upload-file@master
        with:
          access-key-id: ${{ secrets.COVERAGE_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.COVERAGE_S3_SECRET_ACCESS_KEY }}
          bucket: packages
          source: luacov.report.out
          destination: >-
            tarantooldb/dev/coverage-reports/modules/healthcheck-role/${{
            github.ref_type == 'tag' && github.ref_name || 'master'
            }}/luacov.report.out
